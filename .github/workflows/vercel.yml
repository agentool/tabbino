name: Vercel
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, prod]
concurrency:
  group: vercel-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm install --global vercel@59.11.7
      - name: Pull preview environment
        if: github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build preview
        if: github.event_name == 'pull_request'
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
      - name: Pull production environment
        if: github.event_name == 'push'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production
        if: github.event_name == 'push'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        if: github.event_name == 'push'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
